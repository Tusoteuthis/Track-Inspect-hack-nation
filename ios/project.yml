name: TrackInspect
options:
  bundleIdPrefix: ai.trackinspect.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "29"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "0.7.0"
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: "3.4.0"
  MentraBluetoothSDK:
    url: https://github.com/Mentra-Community/mentra-bluetooth-sdk-ios.git
    exactVersion: "0.1.20"
targets:
  TrackInspect:
    type: application
    platform: iOS
    sources:
      - path: TrackInspect
        excludes: ["Config/**", "**/.DS_Store"]
    configFiles:
      Debug: TrackInspect/Config/Base.xcconfig
      Release: TrackInspect/Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.trackinspect.app
        INFOPLIST_FILE: TrackInspect/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: ElevenLabs
        product: ElevenLabs
      - package: MentraBluetoothSDK
        product: MentraBluetoothSDK
  TrackInspectTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrackInspectTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackInspect
  TrackInspectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TrackInspectUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TrackInspect
schemes:
  TrackInspect:
    build:
      targets:
        TrackInspect: all
    test:
      targets: [TrackInspectTests, TrackInspectUITests]
